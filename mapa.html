:root{--paper:#f7f1e7;--ink:#2b2622;--muted:#8a7563;--clay:#b5694a;--cream:#fbf6ee;--line:#cdbb9f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;display:grid;place-items:center;padding:16px;text-align:center}
.box{max-width:420px;width:100%}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(34px,8vw,48px);line-height:1.05}
.k{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--clay);margin-bottom:14px}
.bar{height:2px;background:#e6d6bd;border-radius:2px;margin:28px auto 10px;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--clay);transition:width .2s}
.st{font-size:13px;color:var(--muted)}
form{display:none;margin-top:26px}
form.on{display:block}
label{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:21px;margin-bottom:12px}
input{width:100%;font:inherit;font-size:17px;padding:14px 18px;border:1px solid var(--line);border-radius:999px;background:var(--cream);color:var(--ink);text-align:center}
input:focus{outline:2px solid var(--clay);outline-offset:2px}
button{margin-top:12px;font:inherit;font-size:15px;padding:13px 28px;border-radius:999px;border:0;background:var(--ink);color:var(--cream);cursor:pointer}
.err{color:var(--clay);font-size:13px;margin-top:10px;min-height:18px}
a{color:var(--muted);font-size:13px;display:inline-block;margin-top:22px}
</style>
</head>
<body>
<div class="box">
  <div class="k">Sebas y Aleja</div>
  <h1>Nuestro mapa</h1>
  <div id="load"><div class="bar"><i id="pb"></i></div><div class="st" id="st">Abriendo…</div></div>
  <p class="st" id="nok" style="display:none;margin-top:24px">Abre el link completo que te mandó Sebas.</p>
  <a href="./">Volver a la tarjeta</a>
</div>
<script>
(()=>{
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const _CHK=b64d('HKMjdeHu1cT1Ka/kL7ei0hFwHXGsQJI8NeKRzKnW');
function keyStr(){const m=(location.hash||'').match(/k=([A-Za-z0-9_-]{20,})/);if(m){try{localStorage.setItem('coincidir-llave',m[1])}catch(e){}return m[1];}try{return localStorage.getItem('coincidir-llave')}catch(e){return null}}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
async function getKey(){const s=keyStr();if(!s)return null;try{const k=await crypto.subtle.importKey('raw',b64d(s),'AES-GCM',false,['decrypt']);await dec(k,_CHK.buffer);return {key:k,s};}catch(e){return null}}
const PARTS={"libro.bin": 3, "mapa.bin": 2, "historia.bin": 3};
async function fetchBin(url,onp){ const n=PARTS[url]||0; if(!n) return fetchOne(url,onp);
  const prog=new Array(n).fill(0); const bufs=await Promise.all([...Array(n).keys()].map(i=>fetchOne(url.replace('.bin','-'+(i+1)+'.bin'),v=>{prog[i]=v;onp&&onp(prog.reduce((a,b)=>a+b,0)/n);})));
  const tot=bufs.reduce((a,b)=>a+b.byteLength,0), out=new Uint8Array(tot); let o=0; for(const b of bufs){out.set(new Uint8Array(b),o);o+=b.byteLength;} return out.buffer; }
async function fetchOne(url,onp){const r=await fetch(url);if(!r.ok)throw new Error('No se pudo cargar '+url);const tot=+r.headers.get('content-length')||0;
  if(!r.body||!tot){const b=await r.arrayBuffer();onp&&onp(1);return b;}
  const rd=r.body.getReader();const parts=[];let got=0;for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onp&&onp(got/tot);}
  const out=new Uint8Array(got);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}return out.buffer;}
function toDataURL(buf,type){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(new Blob([buf],{type}));});}

const MAIN='mapa.bin', SONGS=[{"bin": "c1.bin", "name": "cancion.mp3"}, {"bin": "c2.bin", "name": "cancion2.mp3"}];
const pb=document.getElementById('pb'), st=document.getElementById('st');
async function openWith(key){
  document.getElementById('load').style.display='block';
  try{
    let p=[0,0,0]; const up=()=>{pb.style.width=(100*(p[0]*.8+(p[1]+p[2])*.1)).toFixed(0)+'%';};
    const jobs=[fetchBin(MAIN,v=>{p[0]=v;up();})].concat(SONGS.map((s,i)=>fetchBin(s.bin,v=>{p[i+1]=v;up();})));
    const bufs=await Promise.all(jobs); st.textContent='Ya casi…';
    let html=new TextDecoder().decode(await dec(key,bufs[0]));
    for(let i=0;i<SONGS.length;i++){ const d=await toDataURL(await dec(key,bufs[i+1]),'audio/mpeg'); html=html.split("'"+SONGS[i].name+"'").join("'"+d+"'"); }
    document.open(); document.write(html); document.close();
  }catch(e){ st.textContent='No se pudo abrir. Revisa la conexión e inténtalo de nuevo.'; console.error(e); }
}
(async()=>{
  const r=await getKey();
  if(r){openWith(r.key);return;}
  document.getElementById('load').style.display='none'; document.getElementById('nok').style.display='block';
})();
})();
</script>
</body>
</html>
